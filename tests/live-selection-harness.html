<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>live selection harness</title>
</head>
<body>
<!--
  mobile_app.html をライブモード(demo=1 を付けない)で iframe に読み込み、
  __liveRenderTestHooks 経由で公開状態を差し替えながら投票/夜行動の描画を叩く。

  検証したいのは「サーバから public が届くたびに再描画されても、入力中の選択が
  残るか」という一点。実ブラウザでの DOM の状態でしか判定できないため、
  tests/viewport-harness と同じく headless Chromium + --dump-dom で結果を回収する。
  結果は #out に、開始/終了マーカーで囲んだ JSON として出す。
-->
<iframe id="app" src="/mobile_app.html" style="width:390px;height:760px;border:0"></iframe>
<pre id="out">RESULT_START{"pending":true}RESULT_END</pre>
<script>
(function () {
  'use strict';
  var results = [];
  function check(name, ok, detail) {
    results.push({ name: name, ok: !!ok, detail: detail == null ? '' : String(detail) });
  }

  function publicView(opts) {
    var players = {
      p1: { id: 'p1', displayName: 'あなた', alive: true, death: null, revealedRoleId: null },
      ai1: { id: 'ai1', displayName: '虎鉄', alive: true, death: null, revealedRoleId: null },
      ai2: { id: 'ai2', displayName: '凛', alive: true, death: null, revealedRoleId: null },
      ai3: { id: 'ai3', displayName: '沙耶', alive: true, death: null, revealedRoleId: null }
    };
    (opts.dead || []).forEach(function (id) {
      players[id].alive = false;
      players[id].death = { round: opts.round, cause: 'execution' };
    });
    return {
      gameId: 'r1', revision: opts.revision, gmMode: 'computer',
      phase: opts.phase || 'vote', round: opts.round, deadlineAt: null,
      players: players, pendingVoteCount: opts.votes || 0,
      pendingActionCount: opts.actions || 0, lastVote: opts.lastVote || null, winner: null
    };
  }

  function finish() {
    var passed = results.filter(function (r) { return r.ok; }).length;
    document.getElementById('out').textContent =
      'RESULT_START' + JSON.stringify({ total: results.length, passed: passed, results: results }) + 'RESULT_END';
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // ソロ進行ドライバ(E-1 恒久停止 / E-4 二重発火)。
  // hostDriverTick は 1 秒間隔のタイマーからも呼ばれるので、明示的に叩いた回数
  // ちょうどではなく「発火したフェーズの並び」で判定する。
  function runHostDriver(w, hooks) {
    var calls = [];
    var fail = false;
    hooks.resetHostDriver();
    w.appState.solo = true;
    w.appState.view = 'host';
    hooks.setPlayers([
      { id: 'p1', name: 'あなた', role: 'host', connected: true, joinedAt: 1 },
      { id: 'ai_1', name: '虎鉄', role: 'ai', connected: true, joinedAt: 2 },
      { id: 'ai_2', name: '凛', role: 'ai', connected: true, joinedAt: 3 }
    ]);
    w.liveClient = {
      uid: 'p1',
      advanceAiTurn: function (arg) {
        calls.push(arg.phase);
        return fail ? Promise.reject(new Error('deadline-exceeded')) : Promise.resolve({ actions: 2, messages: 0, errors: 0 });
      }
    };

    function at(round, phase) {
      hooks.setPublic(publicView({ round: round, revision: round * 100 + calls.length, phase: phase }));
      hooks.hostDriverTick();
      return sleep(30);
    }

    // --- E-4: 投票解決後に day へ戻っても2度目の発話を発火しない --------
    return at(1, 'day')
      .then(function () { return at(1, 'vote'); })
      .then(function () { return at(1, 'day'); })   // RESOLVE_VOTE 後の day
      .then(function () {
        check('E-4: 投票解決後の day で2度目のAI発話が発火しない',
          calls.join(',') === 'day,vote', calls.join(','));

        // --- E-1: 失敗し続けても打ち切って進行を再開できる ---------------
        hooks.resetHostDriver();
        calls.length = 0;
        fail = true;
        var key = '2:night';
        var attempt = function () {
          hooks.setPublic(publicView({ round: 2, revision: 900 + calls.length, phase: 'night' }));
          hooks.hostDriverTick();
          return sleep(20).then(function () {
            // バックオフを跨いで再試行できるよう、待ち時刻をこちらで解除する
            hooks.hostDriver.aiTurnRetryAt = 0;
          });
        };
        return attempt().then(attempt).then(attempt).then(attempt).then(function () {
          check('E-1: 失敗が続いても再試行は打ち切られる', calls.length <= 4, '呼び出し ' + calls.length + ' 回');
          check('E-1: 打ち切り後は完了扱いになり進行が再開できる',
            hooks.hostDriver.aiTurnDone[key] === true,
            JSON.stringify(hooks.hostDriver.aiTurnDone));
        });
      });
  }

  // s07 役職ピッカー。用意した絵札のすべてが、どのモードでも選べる状態かを見る。
  function runRolePicker(w) {
    var d = w.document;
    w.showScreen('s07');
    var picker = d.getElementById('rolePicker');
    check('役職ピッカーが描画される', !!picker && picker.children.length > 0);
    if (!picker) return;

    var cells = picker.querySelectorAll('.role-pick');
    check('用意した24役職ぶんの枠がある', cells.length === 24, '実際は ' + cells.length);
    check('陣営ごとに3グループに分かれている',
      picker.querySelectorAll('.role-picker-group').length === 3,
      String(picker.querySelectorAll('.role-picker-group').length));
    check('各枠に絵札の画像が入っている',
      picker.querySelectorAll('.role-pick .roster-char').length === cells.length);
    check('絵札を押すとカードを大きく見られる',
      !!picker.querySelector('.role-pick .roster-cell[role="button"]'));

    // かつてソロから締め出されていた役職が、いまは選べること
    ['magician', 'trapper', 'necromancer', 'god', 'double', 'hunter', 'spy', 'mysterious_fox', 'android', 'dictator']
      .forEach(function (id) {
        check('役職 ' + id + ' が選べる', !!picker.querySelector('.role-pick .roster-cell[aria-label]') &&
          Array.prototype.some.call(cells, function (c) {
            return c.querySelector('.roster-char') && c.querySelector('.roster-char').src.indexOf(id) !== -1;
          }));
      });

    function totalText() { return d.getElementById('compositionTotal').textContent; }
    function cellFor(index) { return cells[index]; }
    var before = totalText();
    var firstCellBefore = picker.querySelector('.role-pick');
    cellFor(0).querySelectorAll('button')[1].click(); // ＋
    check('＋で合計が増える', totalText() !== before, before + ' → ' + totalText());
    check('数を変えても一覧は作り直されない(スクロール位置が先頭へ飛ばない)',
      picker.querySelector('.role-pick') === firstCellBefore);
    cellFor(0).querySelectorAll('button')[0].click(); // −
    check('−で元に戻る', totalText() === before, before + ' → ' + totalText());

    d.getElementById('compPresetClear').click();
    check('「すべて外す」で選択が0になる', totalText().indexOf('0') !== -1, totalText());
    var warn = d.getElementById('compositionWarning');
    check('0人のときは不備が警告される', warn.style.display !== 'none' && warn.textContent.length > 0);

    d.getElementById('compPresetRecommended').click();
    var wolfCell = Array.prototype.filter.call(d.querySelectorAll('#rolePicker .role-pick'), function (c) {
      var img = c.querySelector('.roster-char');
      return img && /werewolf_ver/.test(img.src);
    })[0];
    check('おすすめ構成で人狼が1人以上入る',
      !!wolfCell && Number(wolfCell.querySelector('.role-pick-count').textContent) >= 1);
    check('おすすめ構成では不備の警告が出ない',
      d.getElementById('compositionWarning').style.display === 'none',
      d.getElementById('compositionWarning').textContent);
  }

  // 3つの遊び方(ひとり用 / 人間+AI / 人間だけ)が同じ導線で成立するか。
  function runTableModes(w, hooks) {
    var d = w.document;
    var calls = [];
    hooks.resetHostDriver();
    w.appState.view = 'host';
    w.liveClient = {
      uid: 'p1',
      advanceAiTurn: function (arg) { calls.push(arg.phase); return Promise.resolve({ actions: 1, messages: 0, errors: 0 }); },
      seatAiPlayers: function () { return Promise.resolve({ seated: [] }); }
    };

    var humansOnly = [
      { id: 'p1', name: 'あなた', role: 'host', connected: true, joinedAt: 1 },
      { id: 'p2', name: '友人A', role: 'player', connected: true, joinedAt: 2 },
      { id: 'p3', name: '友人B', role: 'player', connected: true, joinedAt: 3 }
    ];
    var mixed = humansOnly.concat([{ id: 'ai_1', name: '虎鉄', role: 'ai', connected: true, joinedAt: 4 }]);

    // --- 人間だけの卓: AIの手番を呼んではいけない ---
    w.appState.solo = false;
    hooks.setPlayers(humansOnly);
    hooks.setPublic(publicView({ round: 1, revision: 700, phase: 'night' }));
    hooks.hostDriverTick();
    return sleep(30).then(function () {
      check('人間だけの卓ではAIの手番を呼ばない', calls.length === 0, calls.join(','));

      // --- 人間+AI の卓: ソロを選んでいなくてもAIが動く ---
      hooks.resetHostDriver();
      calls.length = 0;
      hooks.setPlayers(mixed);
      hooks.setPublic(publicView({ round: 1, revision: 701, phase: 'night' }));
      hooks.hostDriverTick();
      return sleep(30);
    }).then(function () {
      check('人間+AIの卓ではAIの手番が動く', calls.join(',') === 'night', calls.join(','));

      // --- 待合の間: AI同席コントロールの出し分け ---
      hooks.setPlayers(mixed);
      w.appState.solo = false;
      w.appState.view = 'host';
      hooks.renderLobby();
      var seat = d.getElementById('lobbyAiSeat');
      check('共有卓のホストにはAI同席コントロールが出る', !seat.classList.contains('u-hidden'));
      check('現在のAI人数が表示される', d.getElementById('lobbyAiCount').textContent === '1',
        d.getElementById('lobbyAiCount').textContent);
      check('ロビーの一覧でAIはAIと分かる',
        d.getElementById('lobbyPlayerList').textContent.indexOf('AI') !== -1);

      w.appState.view = 'player';
      hooks.renderLobby();
      check('参加者側にはAI同席コントロールを出さない', seat.classList.contains('u-hidden'));

      w.appState.view = 'host';
      w.appState.solo = true;
      hooks.renderLobby();
      check('ひとり用の卓では待合のAI同席コントロールを出さない', seat.classList.contains('u-hidden'));
      w.appState.solo = false;
    });
  }

  // 監査D章「画面に出ている数字や名前が実データではない」の回帰。
  function runTruthfulDisplay(w, hooks) {
    var d = w.document;
    w.liveClient = { uid: 'p1' };

    // 自分の役職タブ — かつては誰が何を引いても「市民」固定だった
    hooks.setSelf({ id: 'p1', displayName: 'あなた', roleId: 'trapper', alive: true, pendingAction: null });
    hooks.updateRulesDrawer();
    check('「自分の役職」が実際に配られた役職になる',
      d.getElementById('myroleNameLabel').textContent === '罠師',
      d.getElementById('myroleNameLabel').textContent);
    check('立ち回りの助言もその役職のものになる',
      d.getElementById('myroleAdviceLabel').textContent.indexOf('罠') !== -1,
      d.getElementById('myroleAdviceLabel').textContent);
    check('「自分の役職」タブにも絵札が出る',
      !!d.querySelector('#myroleCardSlot .card-wrapper'));

    // 投票済み n / m
    var pub = publicView({ round: 2, revision: 800, phase: 'vote', votes: 2, dead: ['ai3'] });
    hooks.setPublic(pub);
    hooks.renderVote();
    check('「投票済み」が実データになる',
      d.getElementById('voteProgress').textContent.replace(/\s/g, '') === '投票済み2/3',
      d.getElementById('voteProgress').textContent);

    // 投票の残り時間
    pub.deadlineAt = Date.now() + 45000;
    hooks.setPublic(pub);
    hooks.updatePhaseWidgets();
    check('投票画面の残り時間が動く',
      /^00:4[0-9]$/.test(d.getElementById('voteCountdown').textContent),
      d.getElementById('voteCountdown').textContent);

    // 夜に行動を終えた人数
    hooks.setPublic(publicView({ round: 2, revision: 801, phase: 'night', actions: 3 }));
    hooks.updatePhaseWidgets();
    check('夜に行動を終えた人数が実データになる',
      d.getElementById('s12WaitingNum').textContent === '3',
      d.getElementById('s12WaitingNum').textContent);

    // 同票の表示
    var tie = publicView({ round: 2, revision: 802, phase: 'day' });
    tie.lastVote = { round: 2, counts: { ai1: 2, ai2: 2, p1: 1 }, executedPlayerId: null, tied: true };
    hooks.setPublic(tie);
    hooks.renderVoteResult();
    var pills = d.querySelectorAll('#s16 .vote-pill');
    check('同票で並んだのは実際の2人', pills.length === 2, String(pills.length));
    check('同票の名前が実データ',
      pills.length === 2 && /虎鉄/.test(pills[0].textContent) && /凛/.test(pills[1].textContent),
      pills.length ? pills[0].textContent + '|' + pills[1].textContent : '');
    check('同票の票数が実データ',
      pills.length === 2 && pills[0].querySelector('.vote-pill-count').textContent === '2');

    // 前夜の記録
    var morning = publicView({ round: 3, revision: 803, phase: 'day' });
    morning.players.ai2.alive = false;
    morning.players.ai2.death = { round: 3, cause: 'night_attack' };
    hooks.setPublic(morning);
    hooks.renderDiscussion();
    check('前夜の記録が実際に失われた人になる',
      d.getElementById('s14PrevRecord').textContent.indexOf('凛') !== -1,
      d.getElementById('s14PrevRecord').textContent);

    // 招待リンク
    var invite = hooks.buildInviteUrl('K7M2Q9');
    check('共有リンクが実際に入室できるURLになる',
      invite.indexOf('example.invalid') === -1 && invite.indexOf('?room=K7M2Q9') !== -1, invite);
  }

  // 記録者の読み上げ。実際に音が出たかは測れないので、
  // 「どの場面で何を喋ろうとしたか」を SpeechSynthesis に差し替えて見る。
  function runNarration(w, hooks) {
    var d = w.document;
    var spoken = [];
    check('この環境で読み上げAPIが使える', hooks.narrationSupported());
    if (!hooks.narrationSupported()) return;
    w.speechSynthesis.speak = function (u) { spoken.push(u.text); };
    w.speechSynthesis.cancel = function () {};
    if (w.gekkaSound && w.gekkaSound.isMuted && w.gekkaSound.isMuted()) {
      w.gekkaSound.setMuted(false);
    }
    check('読み上げの既定はオン', hooks.isNarrationEnabled());

    var night = publicView({ round: 1, revision: 900, phase: 'night' });
    hooks.narratePhaseChange('night', 'role_reveal', night);
    check('夜の始まりを読み上げる', /夜が来ました/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    var morning = publicView({ round: 1, revision: 901, phase: 'day' });
    morning.players.ai3.alive = false;
    morning.players.ai3.death = { round: 1, cause: 'night_attack' };
    hooks.narratePhaseChange('day', 'night', morning);
    check('朝に失われた人の名前を読み上げる',
      /沙耶/.test(spoken.join('|')) && /朝が来ました/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    var quiet = publicView({ round: 2, revision: 902, phase: 'day' });
    hooks.narratePhaseChange('day', 'night', quiet);
    check('誰も死ななかった朝もそう読み上げる', /誰も失われ/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    hooks.narratePhaseChange('vote', 'day', publicView({ round: 2, revision: 903, phase: 'vote' }));
    check('投票の開始を読み上げる', /投票/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    var verdict = publicView({ round: 2, revision: 904, phase: 'day' });
    verdict.players.ai1.alive = false;
    verdict.players.ai1.death = { round: 2, cause: 'execution' };
    hooks.narratePhaseChange('day', 'vote', verdict);
    check('評決の結果を読み上げる', /虎鉄 が処刑されました/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    var finished = publicView({ round: 3, revision: 905, phase: 'finished' });
    finished.winner = { teams: ['citizen'], reason: 'win_condition' };
    hooks.narratePhaseChange('finished', 'vote', finished);
    check('決着を読み上げる', /市民チーム の勝利です/.test(spoken.join('|')), spoken.join('|'));

    spoken.length = 0;
    hooks.narratePhaseChange('night', 'night', publicView({ round: 3, revision: 906, phase: 'night' }));
    check('フェーズが変わっていなければ喋らない', spoken.length === 0, spoken.join('|'));

    // 消音との関係
    spoken.length = 0;
    if (w.gekkaSound && w.gekkaSound.setMuted) {
      w.gekkaSound.setMuted(true);
      hooks.narratePhaseChange('night', 'day', publicView({ round: 4, revision: 907, phase: 'night' }));
      check('音を消している間は読み上げない', spoken.length === 0, spoken.join('|'));
      w.gekkaSound.setMuted(false);
    }

    // 設定のトグル
    spoken.length = 0;
    var btn = d.getElementById('narrationToggleBtn');
    check('ルールに読み上げの切り替えがある', !!btn);
    check('切り替えの初期表示がオン', btn && btn.textContent === 'オン', btn && btn.textContent);
    w.toggleNarration();
    check('オフにできる', btn.textContent === 'オフ' && !hooks.isNarrationEnabled());
    spoken.length = 0;
    hooks.narratePhaseChange('night', 'day', publicView({ round: 5, revision: 908, phase: 'night' }));
    check('オフのあいだは読み上げない', spoken.length === 0, spoken.join('|'));
    w.toggleNarration();
    check('オンに戻せる', btn.textContent === 'オン' && hooks.isNarrationEnabled());
  }

  // 用意した絵札を見られる場所が、実際にいくつあるか。
  function runCardExposure(w) {
    var d = w.document;

    // 役職図鑑: 24枚の原画が背景つきで並び、そこから全画面にできる
    w.showScreen('s01');
    var rulesBtn = d.getElementById('rulesBtn');
    if (rulesBtn) rulesBtn.click();
    var pediaTab = d.querySelector('#rulesTabs [data-tab="roles"], #rulesTabs button:nth-child(3)');
    if (pediaTab) pediaTab.click();
    var pedia = d.getElementById('roleCardGrid');
    check('役職図鑑に役職が並ぶ', !!pedia && pedia.children.length >= 24,
      pedia ? String(pedia.children.length) : 'なし');
    check('図鑑のサムネにも絵札の背景が敷かれている',
      !!pedia && pedia.querySelectorAll('.role-card-thumb-bg').length >= 24,
      pedia ? String(pedia.querySelectorAll('.role-card-thumb-bg').length) : '0');
    check('図鑑から絵札を全画面にできる',
      !!pedia && pedia.querySelectorAll('.role-card-zoom').length >= 24,
      pedia ? String(pedia.querySelectorAll('.role-card-zoom').length) : '0');

    var zoom = pedia && pedia.querySelector('.role-card-zoom');
    if (zoom) {
      zoom.click();
      var overlay = d.getElementById('cardFullscreen');
      check('全画面のカードが実際に開く',
        !!overlay && !overlay.classList.contains('u-hidden') &&
        !!overlay.querySelector('.card-wrapper'));
      w.closeCardFullscreen();
    }
    var closeBtn = d.getElementById('rulesCloseBtn');
    if (closeBtn) closeBtn.click();

    // 役職確認: 一度めくれば、いつでも大きく見られる
    w.showScreen('s09');
    var zoomBtn = d.getElementById('roleZoomBtn');
    check('役職確認に「絵札を大きく見る」がある', !!zoomBtn);
    check('めくる前は出さない', zoomBtn && zoomBtn.classList.contains('u-hidden'));

    // 結果画面: 全員の絵札が並ぶ
    w.showScreen('s18');
    var roster = d.getElementById('rosterGrid');
    check('終幕で全員の絵札が並ぶ',
      !!roster && roster.querySelectorAll('.roster-cell').length > 0,
      roster ? String(roster.querySelectorAll('.roster-cell').length) : 'なし');
    check('終幕の絵札も押して大きく見られる',
      !!roster && !!roster.querySelector('.roster-cell[role="button"]'));
  }

  // 監査B章: オーバーレイの共通基盤。暗転・背景ロック・閉じる手段・フォーカス。
  function runOverlays(w) {
    var d = w.document;
    var scrim = d.getElementById('overlayScrim');
    check('暗転レイヤーが存在する', !!scrim);
    if (!scrim) return;
    check('何も開いていなければ暗転は出ない', scrim.classList.contains('u-hidden'));

    var rulesBtn = d.getElementById('rulesBtn');
    var drawer = d.getElementById('rulesDrawer');
    rulesBtn.click();
    check('ルールを開くと暗転が出る', !scrim.classList.contains('u-hidden'));
    check('開いている間は背景をスクロールさせない', d.body.classList.contains('has-overlay'));
    check('背後のアプリを支援技術から隠す',
      d.querySelector('.desktop-layout').getAttribute('aria-hidden') === 'true');
    check('フォーカスがドロワーの中へ移る', drawer.contains(d.activeElement),
      d.activeElement ? d.activeElement.id || d.activeElement.tagName : 'なし');

    // 暗転をタップして閉じる（閉じる手段がボタン1つしか無かった）
    scrim.click();
    check('暗転をタップすると閉じる', !drawer.classList.contains('is-open'));
    check('閉じたら暗転も消える', scrim.classList.contains('u-hidden'));
    check('閉じたら背景ロックも解ける', !d.body.classList.contains('has-overlay'));
    check('閉じたら背後を支援技術に戻す',
      !d.querySelector('.desktop-layout').hasAttribute('aria-hidden'));
    check('閉じたらフォーカスが開いたボタンへ戻る', d.activeElement === rulesBtn,
      d.activeElement ? d.activeElement.id || d.activeElement.tagName : 'なし');

    // ESC で閉じる
    rulesBtn.click();
    check('もう一度開ける', drawer.classList.contains('is-open'));
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('ESCで閉じる', !drawer.classList.contains('is-open'));

    // 開発者ホットスポットがドロワーの閉じるボタンを奪わない
    var hotspotZ = Number(w.getComputedStyle(d.getElementById('devHotspot')).zIndex);
    var drawerZ = Number(w.getComputedStyle(drawer).zIndex);
    check('開発者ホットスポットはオーバーレイより後ろ', hotspotZ < drawerZ,
      hotspotZ + ' vs ' + drawerZ);
    var scrimZ = Number(w.getComputedStyle(scrim).zIndex);
    check('暗転はオーバーレイの真下に入る', scrimZ < drawerZ, scrimZ + ' vs ' + drawerZ);

    // カード全画面も同じ基盤に乗っている
    w.openCardFullscreen('werewolf');
    check('カード全画面でも暗転と背景ロックが効く',
      !d.body.classList.contains('has-overlay') === false);
    w.closeCardFullscreen();
    check('カード全画面を閉じると解ける', !d.body.classList.contains('has-overlay'));
  }

  // 監査G章: キーボードとスクリーンリーダー。
  function runAccessibility(w, hooks) {
    var d = w.document;
    w.liveClient = { uid: 'p1' };
    hooks.setPublic(publicView({ round: 1, revision: 950, phase: 'vote' }));
    hooks.renderVote();
    var row = d.querySelector('#voteTargetList .target-option[data-pid="ai2"]');
    check('投票の対象行がキーボードで到達できる',
      row && row.getAttribute('tabindex') === '0' && row.getAttribute('role') === 'button');
    // Enter で選べる（決定ボタンは選ぶまで disabled なので、ここが要）
    row.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check('Enterで投票先を選べる', row.classList.contains('is-selected'));
    check('選択状態が aria-pressed にも出る', row.getAttribute('aria-pressed') === 'true');
    check('選ぶと確定ボタンが押せるようになる', d.getElementById('voteDecideBtn').disabled === false);

    hooks.setSelf({ id: 'p1', displayName: 'あなた', roleId: 'prophet', alive: true, pendingAction: null });
    hooks.setPublic(publicView({ round: 1, revision: 951, phase: 'night' }));
    hooks.renderNight();
    var nightRow = d.querySelector('#liveNightTargetList .target-option[data-pid="ai1"]');
    check('夜の対象行もキーボードで到達できる',
      nightRow && nightRow.getAttribute('tabindex') === '0');
    nightRow.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    check('Enterで夜の対象を選べる', nightRow.classList.contains('is-selected'));

    // 画面遷移でフォーカスが移る
    w.showScreen('s01');
    w.showScreen('s05');
    check('画面が変わるとフォーカスも移る', d.activeElement === d.getElementById('s05'),
      d.activeElement ? d.activeElement.id || d.activeElement.tagName : 'なし');

    check('トーストが読み上げられる',
      d.getElementById('toast').getAttribute('aria-live') === 'polite');
    check('接続状態が読み上げられる',
      d.getElementById('connBanner').getAttribute('aria-live') === 'polite');
    check('表示名の入力にラベルがある',
      !!d.getElementById('displayNameInput').getAttribute('aria-label'));
  }

  function run(w) {
    var hooks = w.__liveRenderTestHooks;
    check('テストフックが公開されている', !!hooks);
    if (!hooks) return finish();
    w.liveClient = { uid: 'p1' };
    var d = w.document;
    var voteRow = function (pid) { return d.querySelector('#voteTargetList .target-option[data-pid="' + pid + '"]'); };
    var nightRow = function (pid) { return d.querySelector('#liveNightTargetList .target-option[data-pid="' + pid + '"]'); };
    var voteBtn = function () { return d.getElementById('voteDecideBtn'); };
    var nightBtn = function () { return d.getElementById('liveNightDecideBtn'); };

    /* ---- C-1: 投票 ---------------------------------------------------- */
    hooks.setPublic(publicView({ round: 1, revision: 10, votes: 0 }));
    hooks.renderVote();
    check('投票: 対象行が描画される', !!voteRow('ai2'));
    if (!voteRow('ai2')) return finish();
    voteRow('ai2').click();
    check('投票: 選択が反映される', voteRow('ai2').classList.contains('is-selected'));
    check('投票: 確定ボタンが有効になる', voteBtn().disabled === false);

    // AI が投票 → public の revision が変わり onPublic → renderS15Live が再度走る
    hooks.setPublic(publicView({ round: 1, revision: 11, votes: 1 }));
    hooks.renderVote();
    check('C-1: 他人の投票で再描画されても選択が残る',
      voteRow('ai2') && voteRow('ai2').classList.contains('is-selected'));
    check('C-1: 再描画後も確定ボタンが有効なまま', voteBtn().disabled === false);

    // 連続で AI 投票が入っても同じ
    hooks.setPublic(publicView({ round: 1, revision: 12, votes: 3 }));
    hooks.renderVote();
    check('C-1: 連続再描画でも選択が残る',
      voteRow('ai2') && voteRow('ai2').classList.contains('is-selected'));

    // 選んでいた相手が脱落したら選択は落とす
    hooks.setPublic(publicView({ round: 1, revision: 13, votes: 3, dead: ['ai2'] }));
    hooks.renderVote();
    check('投票: 脱落した対象の選択は解除される',
      voteRow('ai2') && !voteRow('ai2').classList.contains('is-selected'));
    check('投票: 選択解除で確定ボタンが無効に戻る', voteBtn().disabled === true);

    // ラウンドが変わったら選択はリセットされる
    hooks.setPublic(publicView({ round: 2, revision: 20, votes: 0 }));
    hooks.renderVote();
    voteRow('ai1').click();
    check('投票: 新ラウンドで選択できる', voteRow('ai1').classList.contains('is-selected'));
    hooks.setPublic(publicView({ round: 3, revision: 30, votes: 0 }));
    hooks.renderVote();
    check('投票: ラウンドが変わると選択はリセットされる',
      voteRow('ai1') && !voteRow('ai1').classList.contains('is-selected'));
    check('投票: リセット後は確定ボタンが無効', voteBtn().disabled === true);

    /* ---- C-2: 夜の行動 ------------------------------------------------ */
    hooks.setPublic(publicView({ round: 1, revision: 40, phase: 'night' }));
    hooks.setSelf({ id: 'p1', displayName: 'あなた', roleId: 'prophet', alive: true, pendingAction: null });
    hooks.renderNight();
    check('夜: 対象行が描画される', !!nightRow('ai1'));
    if (!nightRow('ai1')) return finish();
    nightRow('ai1').click();
    check('夜: 選択が反映される', nightRow('ai1').classList.contains('is-selected'));
    check('夜: 決定ボタンが有効になる', nightBtn().disabled === false);

    // AI の夜行動が 1 体ずつ適用され、そのたびに public が更新される
    hooks.setPublic(publicView({ round: 1, revision: 41, phase: 'night' }));
    hooks.renderNight();
    check('C-2: AI の夜行動で再描画されても選択が残る',
      nightRow('ai1') && nightRow('ai1').classList.contains('is-selected'));
    check('C-2: 再描画後も決定ボタンが有効なまま', nightBtn().disabled === false);

    hooks.setPublic(publicView({ round: 1, revision: 42, phase: 'night' }));
    hooks.renderNight();
    check('C-2: 連続再描画でも夜の選択が残る',
      nightRow('ai1') && nightRow('ai1').classList.contains('is-selected'));

    // 対象が脱落したら落とす
    hooks.setPublic(publicView({ round: 1, revision: 43, phase: 'night', dead: ['ai1'] }));
    hooks.renderNight();
    check('夜: 脱落した対象は一覧から消え選択も解除される', !nightRow('ai1'));
    check('夜: 選択解除で決定ボタンが無効に戻る', nightBtn().disabled === true);

    // 次の夜では選択はリセットされる
    hooks.setPublic(publicView({ round: 2, revision: 50, phase: 'night' }));
    hooks.renderNight();
    nightRow('ai2').click();
    check('夜: 新ラウンドで選択できる', nightRow('ai2').classList.contains('is-selected'));
    hooks.setPublic(publicView({ round: 3, revision: 60, phase: 'night' }));
    hooks.renderNight();
    check('夜: ラウンドが変わると選択はリセットされる',
      nightRow('ai2') && !nightRow('ai2').classList.contains('is-selected'));

    // 行動を記録済み(pendingAction あり)なら操作を受け付けない
    hooks.setSelf({ id: 'p1', displayName: 'あなた', roleId: 'prophet', alive: true, pendingAction: { kind: 'divine', targetId: 'ai1' } });
    hooks.renderNight();
    check('夜: 記録済みなら決定ボタンは隠れる',
      d.getElementById('liveNightRecordedNotice') &&
      !d.getElementById('liveNightRecordedNotice').classList.contains('u-hidden'));

    runRolePicker(w);
    runTruthfulDisplay(w, hooks);
    runNarration(w, hooks);
    runCardExposure(w);
    runOverlays(w);
    runAccessibility(w, hooks);

    runTableModes(w, hooks)
      .then(function () { return runHostDriver(w, hooks); })
      .then(finish, function (e) {
        check('進行ドライバの検証が例外なく完走する', false, (e && e.message) || e);
        finish();
      });
  }

  var frame = document.getElementById('app');
  frame.addEventListener('load', function () {
    // 起動直後の非同期初期化(サウンド/オープニング)を通してから叩く
    setTimeout(function () {
      try { run(frame.contentWindow); }
      catch (e) { check('ハーネスが例外なく完走する', false, (e && e.message) || e); finish(); }
    }, 600);
  });
})();
</script>
</body>
</html>
